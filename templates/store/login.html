{% extends 'base.html' %}
{% load static %}

{% block title %}Login - Antigravity Store{% endblock %}

{% block content %}

    <div class="form-card">
        <h1 class="form-title">Welcome Back</h1>
        <p class="form-subtitle">Enter your credentials to access your account & order history.</p>

        <form action="{% url 'login' %}{% if request.GET.next %}?next={{ request.GET.next }}{% endif %}" method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label class="form-label">Username or Email *</label>
                <input type="text" name="username" class="form-input" placeholder="e.g. john or john@example.com" required autofocus>
            </div>

            <div class="form-group">
                <label class="form-label">Password *</label>
                <input type="password" name="password" class="form-input" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 1rem;">
                <i class="fa-solid fa-right-to-bracket"></i> Sign In
            </button>
        </form>

        <div style="text-align: center; margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid var(--border); font-size: 0.9rem; color: var(--text-muted);">
            Don't have an account yet? <a href="{% url 'register' %}" style="font-weight: 700;">Create one now</a>
        </div>
    </div>

{% endblock %}
